<svg xmlns="http://www.w3.org/2000/svg" width="400" height="575" viewBox="-10 -10 40 57.5">
  <rect x="-10" y="-10" width="40" height="57.5" fill="white" />
  <g stroke="#bbb" stroke-width="0.15">
    <line x1="0" y1="0" x2="0" y2="20" />
    <line x1="5" y1="0" x2="5" y2="20" />
    <line x1="10" y1="0" x2="10" y2="20" />
    <line x1="15" y1="0" x2="15" y2="20" />
    <line x1="20" y1="0" x2="20" y2="20" />
    <line x1="0" y1="0" x2="20" y2="0" />
    <line x1="0" y1="5" x2="20" y2="5" />
    <line x1="0" y1="10" x2="20" y2="10" />
    <line x1="0" y1="15" x2="20" y2="15" />
    <line x1="0" y1="20" x2="20" y2="20" />
  </g>
  <rect data-room="a" x="0" y="0" width="10" height="10" fill="none" stroke="black" stroke-width="0.5" />
