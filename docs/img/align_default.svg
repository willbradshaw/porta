<svg xmlns="http://www.w3.org/2000/svg" width="600" height="885" viewBox="-20 -10 60 88.5" font-family="Palatino, Georgia, Times New Roman, serif" font-weight="400" fill="black">
  <rect x="-20" y="-10" width="60" height="88.5" fill="#e0e0e0" />
  <defs><clipPath id="plan-grid"><path d="M-10 0h10v10h-10z M20 0h10v10h-10z M0 0h20v20h-20z" /></clipPath></defs>
  <g class="grid" clip-path="url(#plan-grid)" stroke="#c4c4c4" stroke-width="0.125">
    <line x1="-10" y1="0" x2="-10" y2="20" />
    <line x1="-5" y1="0" x2="-5" y2="20" />
    <line x1="0" y1="0" x2="0" y2="20" />
    <line x1="5" y1="0" x2="5" y2="20" />
    <line x1="10" y1="0" x2="10" y2="20" />
    <line x1="15" y1="0" x2="15" y2="20" />
    <line x1="20" y1="0" x2="20" y2="20" />
    <line x1="25" y1="0" x2="25" y2="20" />
    <line x1="30" y1="0" x2="30" y2="20" />
    <line x1="-10" y1="0" x2="30" y2="0" />
    <line x1="-10" y1="5" x2="30" y2="5" />
    <line x1="-10" y1="10" x2="30" y2="10" />
    <line x1="-10" y1="15" x2="30" y2="15" />
    <line x1="-10" y1="20" x2="30" y2="20" />
  </g>
  <line class="wall interior" x1="0" y1="0" x2="0" y2="10" stroke="black" stroke-width="0.5" stroke-linecap="square" />
  <line class="wall interior" x1="20" y1="0" x2="20" y2="10" stroke="black" stroke-width="0.5" stroke-linecap="square" />
  <line class="wall exterior" x1="-10" y1="0" x2="-10" y2="10" stroke="black" stroke-width="0.8" stroke-linecap="square" />
  <line class="wall exterior" x1="-10" y1="0" x2="30" y2="0" stroke="black" stroke-width="0.8" stroke-linecap="square" />
  <line class="wall exterior" x1="-10" y1="10" x2="0" y2="10" stroke="black" stroke-width="0.8" stroke-linecap="square" />
  <line class="wall exterior" x1="0" y1="10" x2="0" y2="20" stroke="black" stroke-width="0.8" stroke-linecap="square" />
  <line class="wall exterior" x1="0" y1="20" x2="20" y2="20" stroke="black" stroke-width="0.8" stroke-linecap="square" />
  <line class="wall exterior" x1="20" y1="10" x2="20" y2="20" stroke="black" stroke-width="0.8" stroke-linecap="square" />
