  <rect data-room="b" x="10" y="0" width="10" height="20" fill="none" stroke="black" stroke-width="0.5" />
  <text data-room="b" x="15" y="10" text-anchor="middle" dominant-baseline="central" font-size="6">B</text>
  <text class="scale" x="0" y="32.5" font-size="1.5">1 square = 5 ft</text>
  <text class="key" x="0" y="35" font-size="1.5">A  A  (10x10 ft)</text>
  <text class="key" x="0" y="37.5" font-size="1.5">B  B  (10x20 ft)</text>
