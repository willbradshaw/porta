name: changelog

# Require every PR that changes non-documentation files to update CHANGELOG.md,
# so the Unreleased section always reflects what's landed.
on:
  pull_request:

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect non-documentation changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            non_docs:
              - '**'
              - '!**/*.md'
              - '!docs/**'

      - name: Detect a CHANGELOG update
        uses: dorny/paths-filter@v3
        id: changelog
        with:
          filters: |
            updated:
              - 'CHANGELOG.md'

      - name: Require a CHANGELOG update
        if: steps.filter.outputs.non_docs == 'true' && steps.changelog.outputs.updated != 'true'
        run: |
          echo "::error::This PR changes non-documentation files but does not update CHANGELOG.md"
          echo "Add an entry under '## Unreleased' in CHANGELOG.md describing the change."
          exit 1
