  <g class="key" font-size="5"><text x="-5.395" y="51">A</text>
    <text x="0.287" y="51">Left room</text>
  </g>
  <g class="key" font-size="5"><text x="-4.426" y="59">B</text>
    <text x="0.267" y="59">Right room</text>
