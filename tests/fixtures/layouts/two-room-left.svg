<svg xmlns="http://www.w3.org/2000/svg" width="400" height="475" viewBox="-20 -10 40 47.5">
  <rect x="-20" y="-10" width="40" height="47.5" fill="white" />
  <g stroke="#bbb" stroke-width="0.15">
    <line x1="-10" y1="0" x2="-10" y2="10" />
    <line x1="-5" y1="0" x2="-5" y2="10" />
    <line x1="0" y1="0" x2="0" y2="10" />
    <line x1="5" y1="0" x2="5" y2="10" />
    <line x1="10" y1="0" x2="10" y2="10" />
    <line x1="-10" y1="0" x2="10" y2="0" />
    <line x1="-10" y1="5" x2="10" y2="5" />
    <line x1="-10" y1="10" x2="10" y2="10" />
  </g>
  <rect data-room="a" x="0" y="0" width="10" height="10" fill="none" stroke="black" stroke-width="0.5" />
  <text data-room="a" x="5" y="5" text-anchor="middle" dominant-baseline="central" font-size="6">A</text>
  <rect data-room="b" x="-10" y="0" width="10" height="10" fill="none" stroke="black" stroke-width="0.5" />
  <text data-room="b" x="-5" y="5" text-anchor="middle" dominant-baseline="central" font-size="6">B</text>
  <text class="scale" x="-10" y="22.5" font-size="1.5">1 square = 5 ft</text>
  <text class="key" x="-10" y="25" font-size="1.5">A  A  (10x10 ft)</text>
  <text class="key" x="-10" y="27.5" font-size="1.5">B  B  (10x10 ft)</text>
