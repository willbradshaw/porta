[project]
name = "porta"
version = "1.2.0"
description = "A relational DSL for authoring and rendering SVG floorplans."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Will Bradshaw" }]
keywords = ["dnd", "ttrpg", "floorplan", "svg", "dsl", "cartography"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/willbradshaw/porta"
Repository = "https://github.com/willbradshaw/porta"
Issues = "https://github.com/willbradshaw/porta/issues"

[project.scripts]
porta = "porta.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ruff infers its target Python from requires-python; no need to repeat it here.
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "A",   # flake8-builtins (shadowing builtins)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PIE", # flake8-pie (misc lints)
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# ASCII-art goldens have legitimately long lines (the legend row).
"tests/test_render.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
