[project]
name = "porta"
version = "0.0.1"
description = "A relational DSL for authoring TTRPG floor plans and rendering them to SVG."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Will Bradshaw" }]
keywords = ["dnd", "ttrpg", "floorplan", "svg", "dsl", "cartography"]
dependencies = []

[project.scripts]
porta = "porta.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
